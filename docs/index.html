
<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#176b45">
<title>飴棠豆花訂貨系統</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#20312a;background:#f3f6f4;font-synthesis:none}
*{box-sizing:border-box}
body{margin:0}
header{background:#176b45;color:#fff;padding:18px clamp(16px,3vw,32px);box-shadow:0 2px 8px #0001}
header h1{margin:0;font-size:clamp(1.2rem,3vw,1.65rem);letter-spacing:.03em}
header p{margin:6px 0 0;color:#dcefe4;font-size:.9rem}
main{max-width:1120px;margin:20px auto;padding:0 14px 28px}
.top-fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.field,.panel,.item-panel,.output-panel{background:#fff;border:1px solid #dce5df;border-radius:14px;padding:15px;box-shadow:0 2px 8px #163b2410}
.vendor-note-panel{margin-top:12px;background:#fff9e8;border:1px solid #ead9a7;border-radius:12px;padding:12px 15px;color:#594719}
.vendor-note-panel strong{display:block;font-size:.9rem;margin-bottom:5px}
.vendor-note-text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
label{display:block;font-weight:700;font-size:.92rem;margin-bottom:7px}
select,input,textarea{font:inherit}
select{width:100%;min-height:44px;border:1px solid #cbd8cf;border-radius:9px;background:#fff;padding:9px 10px;color:#20312a}
.readonly{min-height:44px;display:flex;align-items:center;font-weight:700;font-size:1.05rem;color:#176b45}
.content{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:14px;margin-top:14px;align-items:start}
.item-panel{padding:0;overflow:hidden}
.item-heading{display:grid;grid-template-columns:minmax(0,1fr) 112px 105px;gap:8px;background:#e6f2eb;padding:12px 14px;font-weight:800;color:#23563c;position:sticky;top:0;z-index:1}
.items-scroll{overflow-y:auto;overscroll-behavior:contain}
.item-row{display:grid;grid-template-columns:minmax(0,1fr) 112px 105px;gap:8px;align-items:center;padding:9px 14px;border-top:1px solid #edf1ee;min-height:54px}
.item-name{font-weight:650;overflow-wrap:anywhere}
.item-note{display:block;color:#687970;font-size:.78rem;margin-top:3px;white-space:pre-wrap}
.qty{width:100%;min-height:40px;border:1px solid #b9cbbf;border-radius:8px;text-align:center;padding:6px;background:#fff}
.unit{color:#586b60;font-size:.88rem;overflow-wrap:anywhere}
.empty{padding:28px 16px;text-align:center;color:#66766d}
.actions{display:flex;flex-direction:column;gap:10px;position:sticky;top:12px}
.btn{border:0;border-radius:10px;min-height:48px;padding:12px 16px;font:inherit;font-weight:800;cursor:pointer;transition:filter .15s,transform .05s}
.btn:active{transform:translateY(1px)}
.btn:hover{filter:brightness(.96)}
.btn:disabled{opacity:.6;cursor:not-allowed;filter:none}
.submit{background:#16834d;color:white}
.clear{background:#c83f3f;color:white}
.output-panel{margin-top:14px}
.output-panel h2{font-size:1rem;margin:0 0 8px}
.output-help{font-size:.84rem;color:#65756c;margin:0 0 10px}
textarea{width:100%;min-height:150px;resize:vertical;border:1px solid #cbd8cf;border-radius:9px;padding:12px;line-height:1.65;background:#fbfdfb}
.output-buttons{display:flex;gap:8px;margin-top:8px}
.copy{background:#e5eee8;color:#23563c;min-height:40px}
.status{font-size:.86rem;color:#176b45;min-height:1.2em;margin:8px 0 0}
footer{text-align:center;color:#75857c;font-size:.8rem;padding:12px}
@media(max-width:760px){
 main{margin:12px auto}
 .top-fields{grid-template-columns:1fr 1fr}
 .field:last-child{grid-column:1/-1}
 .content{grid-template-columns:1fr}
 .actions{position:static;display:grid;grid-template-columns:1fr 1fr;order:2}
 .item-heading,.item-row{grid-template-columns:minmax(0,1fr) 88px 78px;gap:6px;padding-left:10px;padding-right:10px}
 .item-heading{font-size:.88rem}
 .item-row{min-height:52px}
 .qty{min-height:42px}
}
@media(max-width:420px){.top-fields{grid-template-columns:1fr}.field:last-child{grid-column:auto}}
 /* 分店訂貨頁面不顯示本機訂單紀錄與每月報表 */
#recordsPanel {
  display: none !important;
}
</style>
</head>
<body>
<header>
  <h1>飴棠豆花訂貨系統</h1>
  <p>請選擇店家與廠商，填寫需要訂購的數量後送出。</p>
</header>
<main>
  <section class="top-fields" aria-label="訂單基本資料">
    <div class="field">
      <label for="store">店家</label>
      <select id="store" autocomplete="off"></select>
    </div>
    <div class="field">
      <label for="vendor">廠商</label>
      <select id="vendor" autocomplete="off"></select>
    </div>
    <div class="field">
      <label>訂貨日期</label>
      <div id="orderDate" class="readonly" aria-live="polite"></div>
    </div>
  </section>
  <section class="vendor-note-panel" aria-live="polite" aria-label="廠商備註">
    <strong>廠商備註／訂貨日期</strong>
    <div id="vendorNote" class="vendor-note-text">選擇廠商後顯示備註。</div>
  </section>
  <section class="content">
    <div class="item-panel">
      <div class="item-heading"><span>訂貨項目</span><span>數量</span><span>單位</span></div>
      <div id="itemsScroll" class="items-scroll"><div class="empty">正在載入訂貨資料…</div></div>
    </div>
    <aside class="actions" aria-label="訂單操作">
      <button class="btn submit" id="submitBtn" type="button">生成文字</button>
      <button class="btn clear" id="clearBtn" type="button">清除</button>
    </aside>
  </section>
  <section class="output-panel">
    <h2>訂單輸出內容</h2>
    <p class="output-help">生成文字後會依照原訂單格式產生文字；數量空白或為 0 的項目不會輸出。</p>
    <textarea id="output" aria-label="訂單輸出內容" placeholder="按下「生成文字」後，訂單文字會顯示在這裡。" readonly></textarea>
    <div class="output-buttons"><button class="btn copy" id="copyBtn" type="button">複製文字並送出</button></div>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </section>
  <section class="output-panel" id="recordsPanel">
    <h2>本機訂單紀錄與每月報表</h2>
    <p class="output-help">紀錄只保存在目前瀏覽器。請定期匯出 CSV 備份；清除瀏覽器網站資料可能會使紀錄遺失。</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin:12px 0">
      <div style="min-width:180px;flex:1"><label for="reportMonth">報表月份</label><input id="reportMonth" type="month" style="width:100%;min-height:44px;border:1px solid #cbd8cf;border-radius:9px;padding:8px"></div>
      <button class="btn copy" id="exportDetailBtn" type="button">匯出每日明細 CSV</button>
      <button class="btn copy" id="exportSummaryBtn" type="button">匯出月總計 CSV</button>
    </div>
    <p id="recordCount" class="output-help">目前沒有本機訂單紀錄。</p>
    <h3 style="font-size:.95rem;margin:18px 0 8px">每日訂貨明細</h3>
    <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.9rem"><thead><tr><th>日期</th><th>店家</th><th>廠商</th><th>商品</th><th>數量</th><th>單位</th><th>送單時間</th></tr></thead><tbody id="detailBody"></tbody></table></div>
    <h3 style="font-size:.95rem;margin:22px 0 8px">每月商品總計（依店家／廠商／商品彙總）</h3>
    <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.9rem"><thead><tr><th>店家</th><th>廠商</th><th>商品</th><th>月總數量</th><th>單位</th></tr></thead><tbody id="summaryBody"></tbody></table></div>
    <p id="recordStatus" class="status" role="status" aria-live="polite"></p>
  </section>
</main>
<footer>訂貨資料以 Excel 匯出的 data.json 為準。</footer>
<script>
let DATA = null;
let currentOrder = null;
let isSending = false;
const $ = id => document.getElementById(id);
const storeEl = $('store'), vendorEl = $('vendor'), itemsScroll = $('itemsScroll');

function todayMMDD(){
  const d = new Date();
  return String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0');
}
function outputDate(date = new Date()){
  return String(date.getMonth()+1).padStart(2,'0') + '月' + String(date.getDate()).padStart(2,'0') + '日';
}

const RECORDS_KEY = 'yeetang_order_records_v1';

/* Google Apps Script 網頁應用程式網址 */
const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx_-R0L-S2n-Z58OQdrdVAaSDi4usZ4nf-K9ql0j8ZvzR1Su1qLCThkjkWzPeIVMaTHqw/exec';

function loadRecords(){
  try {
    const value = JSON.parse(localStorage.getItem(RECORDS_KEY) || '[]');
    return Array.isArray(value) ? value : [];
  } catch(e) {
    return [];
  }
}
function saveRecords(records){
  localStorage.setItem(RECORDS_KEY, JSON.stringify(records));
}
function localISODate(date = new Date()){
  return date.getFullYear() + '-' + String(date.getMonth()+1).padStart(2,'0') + '-' + String(date.getDate()).padStart(2,'0');
}
function escapeCSV(value){
  return '"' + String(value ?? '').replace(/"/g, '""') + '"';
}
function downloadCSV(filename, rows){
  const csv = '\uFEFF' + rows.map(row => row.map(escapeCSV).join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8;'}));
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function reportMonth(){
  return $('reportMonth').value || localISODate().slice(0,7);
}
function getMonthRows(){
  const month = reportMonth();
  return loadRecords().filter(record => record.date && record.date.slice(0,7) === month)
    .flatMap(record => (record.items || []).map(item => ({
      ...item,
      date:record.date,
      store:record.store,
      vendor:record.vendor,
      submittedAt:record.submittedAt
    })));
}
function aggregateRows(rows){
  const sums = new Map();
  rows.forEach(row => {
    const key = [row.store,row.vendor,row.name,row.unit].join('|');
    const old = sums.get(key) || {
      store:row.store,
      vendor:row.vendor,
      name:row.name,
      unit:row.unit,
      quantity:0
    };
    old.quantity += Number(row.quantity) || 0;
    sums.set(key,old);
  });
  return [...sums.values()].sort((a,b)=>
    (a.store+a.vendor+a.name).localeCompare(b.store+b.vendor+b.name,'zh-Hant')
  );
}
function renderReports(){
  const rows = getMonthRows();
  const detailBody = $('detailBody');
  const summaryBody = $('summaryBody');
  detailBody.replaceChildren();
  summaryBody.replaceChildren();

  $('recordCount').textContent = reportMonth() + ' 共 ' + rows.length +
    ' 筆商品明細（本機全部訂單 ' + loadRecords().length + ' 張）。';

  const addCell = (tr,value,right=false) => {
    const td = document.createElement('td');
    td.textContent = String(value ?? '');
    td.style.cssText = 'padding:8px;border-bottom:1px solid #edf1ee;' +
      (right ? 'text-align:right;' : '');
    tr.appendChild(td);
  };

  if(!rows.length){
    let tr = document.createElement('tr');
    let td = document.createElement('td');
    td.colSpan = 7;
    td.textContent = '這個月份尚無訂單紀錄。';
    td.style.padding = '12px';
    tr.appendChild(td);
    detailBody.appendChild(tr);

    tr = document.createElement('tr');
    td = document.createElement('td');
    td.colSpan = 5;
    td.textContent = '這個月份尚無訂單紀錄。';
    td.style.padding = '12px';
    tr.appendChild(td);
    summaryBody.appendChild(tr);
    return;
  }

  rows.sort((a,b)=>
    (a.date+a.store+a.vendor+a.name).localeCompare(b.date+b.store+b.vendor+b.name,'zh-Hant')
  );

  rows.forEach(row => {
    const tr = document.createElement('tr');
    addCell(tr,row.date);
    addCell(tr,row.store);
    addCell(tr,row.vendor);
    addCell(tr,row.name);
    addCell(tr,row.quantity,true);
    addCell(tr,row.unit);
    addCell(tr,new Date(row.submittedAt).toLocaleString('zh-TW',{hour12:false}));
    detailBody.appendChild(tr);
  });

  aggregateRows(rows).forEach(row => {
    const tr = document.createElement('tr');
    addCell(tr,row.store);
    addCell(tr,row.vendor);
    addCell(tr,row.name);
    addCell(tr,Number(row.quantity.toFixed(4)),true);
    addCell(tr,row.unit);
    summaryBody.appendChild(tr);
  });
}
function exportDetail(){
  const rows = getMonthRows();
  if(!rows.length){
    $('recordStatus').textContent = '此月份沒有明細可匯出。';
    return;
  }
  downloadCSV(reportMonth()+'_每日訂貨明細.csv',[
    ['日期','店家','廠商','商品','數量','單位','送單時間'],
    ...rows.map(r=>[
      r.date,r.store,r.vendor,r.name,r.quantity,r.unit,
      new Date(r.submittedAt).toLocaleString('zh-TW',{hour12:false})
    ])
  ]);
  $('recordStatus').textContent = '每日明細 CSV 已開始下載。';
}
function exportSummary(){
  const rows = getMonthRows();
  if(!rows.length){
    $('recordStatus').textContent = '此月份沒有總計可匯出。';
    return;
  }
  downloadCSV(reportMonth()+'_每月商品總計.csv',[
    ['店家','廠商','商品','月總數量','單位'],
    ...aggregateRows(rows).map(r=>[
      r.store,r.vendor,r.name,Number(r.quantity.toFixed(4)),r.unit
    ])
  ]);
  $('recordStatus').textContent = '每月商品總計 CSV 已開始下載。';
}

$('orderDate').textContent = todayMMDD();

function setStatus(msg){
  $('status').textContent = msg;
}
function fillSelect(el, values){
  el.replaceChildren();
  values.forEach(value => {
    const option = document.createElement('option');
    option.value = value;
    option.textContent = value;
    el.appendChild(option);
  });
}
function getAllowedItems(store, vendor){
  const all = DATA.itemsByVendor[vendor] || [];
  const blocked = new Set(DATA.blockedItems[store + '||' + vendor] || []);
  return all.filter(item => !blocked.has(item.name));
}
function renderVendorNote(){
  if(!DATA) return;
  const store = storeEl.value;
  const vendor = vendorEl.value;
  // 對應 Excel「訂貨單頁面」A5：依店家與廠商，取可訂品項中第一筆非空白備註。
  const items = getAllowedItems(store, vendor);
  const noteItem = items.find(item => item.note && item.note.trim());
  $('vendorNote').textContent = noteItem
    ? noteItem.note
    : '此廠商目前沒有設定廠商備註／訂貨日期。';
}
function renderItems(){
  if(!DATA) return;
  const store = storeEl.value;
  const vendor = vendorEl.value;
  const items = getAllowedItems(store, vendor);
  renderVendorNote();
  itemsScroll.replaceChildren();

  if(items.length === 0){
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = '此店家／廠商目前沒有可訂購的品項。';
    itemsScroll.appendChild(empty);
    itemsScroll.style.maxHeight = 'calc(3 * 54px)';
    return;
  }

  items.forEach(item => {
    const row = document.createElement('div');
    row.className = 'item-row';

    const name = document.createElement('div');
    name.className = 'item-name';
    name.textContent = item.name;

    if(item.note){
      const note = document.createElement('span');
      note.className = 'item-note';
      note.textContent = item.note;
      name.appendChild(note);
    }

    const qty = document.createElement('input');
    qty.className = 'qty';
    qty.type = 'number';
    qty.min = '0';
    qty.step = 'any';
    qty.value = '0';
    qty.inputMode = 'decimal';
    qty.setAttribute('aria-label', item.name + '數量');
    qty.dataset.item = item.name;
    qty.dataset.unit = item.unit;
    qty.addEventListener('input', () => {
      if(qty.value !== '' && Number(qty.value) < 0) qty.value = '0';
      setStatus('');
    });

    const unit = document.createElement('div');
    unit.className = 'unit';
    unit.textContent = item.unit;

    row.append(name, qty, unit);
    itemsScroll.appendChild(row);
  });

  // 末項後保留兩列的空間；商品多時限制可視高度並在清單內捲動。
  itemsScroll.style.maxHeight = `min(calc(${items.length + 2} * 54px), 58vh)`;
}
function refreshVendors(preferFirst=true){
  const vendors = DATA.vendorsByStore[storeEl.value] || [];
  fillSelect(vendorEl, vendors);
  if(preferFirst && vendors.length) vendorEl.selectedIndex = 0;
  renderItems();
}

storeEl.addEventListener('change', () => {
  refreshVendors(true);
  $('output').value = '';
 currentOrder = null;
  setStatus('店家已更換，廠商已恢復為清單第一項。');
});
vendorEl.addEventListener('change', () => {
  renderItems();
  $('output').value = '';
 currentOrder = null;
  setStatus('');
});


/* 生成文字：只產生訂單，不複製、不開啟 LINE、不寫入後台 */
$('submitBtn').addEventListener('click', () => {
  if (!DATA || !storeEl.value || !vendorEl.value) {
    setStatus('訂貨資料尚未載入完成，請稍後再試。');
    return;
  }

  const store = storeEl.value;
  const vendor = vendorEl.value;
  const now = new Date();
  const date = outputDate(now);

  const lines = [`${store}${DATA.storeSuffix || '店'} ${date}`];
  const orderItems = [];
  const inputs = itemsScroll.querySelectorAll('input.qty');

  inputs.forEach(input => {
    const raw = input.value.trim();
    if (raw === '') return;

    const qty = Number(raw);
    if (!Number.isFinite(qty) || qty <= 0) return;

    lines.push(
      `${input.dataset.item} ${String(qty)} ${input.dataset.unit}`.trim()
    );

    orderItems.push({
      name: input.dataset.item,
      quantity: qty,
      unit: input.dataset.unit
    });
  });

  $('output').value = orderItems.length
    ? lines.join('\n')
    : `${lines[0]}\n（沒有填寫大於 0 的訂購數量）`;

  currentOrder = orderItems.length
    ? {
        requestId: (
          typeof crypto !== 'undefined' &&
          typeof crypto.randomUUID === 'function'
        )
          ? crypto.randomUUID()
          : Date.now() + '-' + Math.random().toString(36).slice(2),
        store,
        vendor,
        orderDate: date,
        items: orderItems
      }
    : null;

  setStatus(
    orderItems.length
      ? '訂單文字已生成，尚未複製、開啟 LINE 或寫入後台。'
      : '已生成訂單標題，但沒有有效商品數量，尚未建立訂單。'
  );
});





/* 複製文字並送出：先複製、送出後台，再開啟 LINE 分享 */
$('copyBtn').addEventListener('click', () => {
  const text = $('output').value;
  const order = currentOrder;

  if (!text || !order || !order.items.length) {
    setStatus('目前沒有有效的訂單，請先按「生成文字」。');
    return;
  }

  if (isSending) return;

  isSending = true;

  const button = $('copyBtn');
  button.disabled = true;
  button.textContent = '處理中…';

  setTimeout(() => {
    isSending = false;
    button.disabled = false;
    button.textContent = '複製文字並送出';
  }, 3000);

  // 先嘗試複製文字，避免開啟 LINE 後失去瀏覽器焦點。
  let copied = false;
  const temp = document.createElement('textarea');
  temp.value = text;
  temp.setAttribute('readonly', '');
  temp.style.position = 'fixed';
  temp.style.left = '-9999px';
  temp.style.top = '0';
  document.body.appendChild(temp);

  temp.focus();
  temp.select();
  temp.setSelectionRange(0, temp.value.length);

  try {
    copied = document.execCommand('copy');
  } catch (e) {
    copied = false;
  }

  temp.remove();

  // 同時嘗試使用瀏覽器剪貼簿 API。
  if (navigator.clipboard &&
      typeof navigator.clipboard.writeText === 'function') {
    navigator.clipboard.writeText(text).catch(() => {});
  }

  // 向 Google Apps Script 傳送訂單。
  // keepalive 可降低切換到 LINE 時請求被中斷的風險。
  fetch(GOOGLE_SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: {
      'Content-Type': 'text/plain;charset=utf-8'
    },
    keepalive: true,
    body: JSON.stringify({
      requestId: order.requestId,
      store: order.store,
      vendor: order.vendor,
      orderDate: order.orderDate,
      items: order.items
    })
  }).catch(() => {});

  // LINE 分享畫面會帶入訂單文字，讓使用者自行選擇對象。
  const lineShareUrl =
    'https://line.me/R/share?text=' + encodeURIComponent(text);

  setStatus(
    (copied
      ? '已嘗試複製訂單文字。'
      : '瀏覽器未確認複製成功，請在 LINE 分享畫面確認文字。') +
    ' 已送出後台寫入請求，請稍後確認「訂單明細」。'
  );

  // 改用目前頁面直接導向 LINE 連結，不再另開新分頁。
  window.location.href = lineShareUrl;
});


    setStatus(
      (lineWindow
        ? '已嘗試開啟 LINE 分享畫面。'
        : '瀏覽器可能阻擋了 LINE 分享畫面，請手動開啟 LINE。') +
      (copied
        ? ' 訂單文字已複製。'
        : ' 自動複製未成功，訂單文字已選取，請手動複製。') +
      ' 後台寫入請求已送出，請確認 Google 試算表「訂單明細」。'
    );
  } catch (e) {
    setStatus(
      '後台請求發生錯誤。請檢查網路及 Google 試算表「訂單明細」。'
    );
  }
});


/* 清除目前訂單輸出與數量 */
$('clearBtn').addEventListener('click', () => {
  itemsScroll.querySelectorAll('input.qty').forEach(input => {
    input.value = '0';
  });

  $('output').value = '';
  currentOrder = null;
  setStatus('已清除目前訂單與所有商品數量。');
});

 
$('reportMonth').value = localISODate().slice(0,7);
$('reportMonth').addEventListener('change', renderReports);
$('exportDetailBtn').addEventListener('click', exportDetail);
$('exportSummaryBtn').addEventListener('click', exportSummary);
renderReports();

fetch('./data.json')
  .then(r => {
    if(!r.ok) throw new Error('無法讀取 data.json');
    return r.json();
  })
  .then(data => {
    DATA = data;
    fillSelect(storeEl, DATA.stores || []);
    refreshVendors(true);
    setStatus('資料載入完成。');
  })
  .catch(err => {
    itemsScroll.innerHTML =
      '<div class="empty">無法載入訂貨資料。請確認 index.html 與 data.json 放在同一個資料夾，並透過 GitHub Pages 或本機網站伺服器開啟。</div>';
    setStatus(err.message);
  });
</script>
</body>
</html>
